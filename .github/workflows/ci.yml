# Eval and build the flake's checks on pushes and PRs. The end-to-end check
# includes a full deepseek-harness build (~20 minutes); the eval steps fail
# fast on packaging mistakes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate all outputs
        run: |
          set -euo pipefail
          nix eval .#dshPackageSets --apply builtins.attrNames
          nix eval .#packages.x86_64-linux --apply builtins.attrNames
          nix eval .#checks.x86_64-linux --apply builtins.attrNames
          nix flake show --legacy

  checks:
    runs-on: ubuntu-latest
    needs: eval
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: End-to-end plugin check (builds deepseek-harness)
        run: nix build -L .#checks.x86_64-linux.plugin-e2e
      - name: Home Manager module check
        run: nix build -L .#checks.x86_64-linux.home-manager-module
      - name: Package version test
        run: nix build -L .#packages.x86_64-linux.deepseek-harness.passthru.tests.version
