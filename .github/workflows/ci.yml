# Eval and build the flake's checks on pushes and PRs. The end-to-end check
# includes a full deepseek-harness build (~20 minutes); the eval steps fail
# fast on packaging mistakes. Both Linux architectures are built; aarch64-darwin
# is only evaluated, because there is no macOS runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate all outputs, every declared system
        run: |
          set -euo pipefail
          # `--no-build` evaluates every check to a derivation but will not
          # perform the builds that import-from-derivation needs — and
          # `pkgs.mkDshPlugin { npmName = …; }` unpacks a registry tarball to
          # read its `package.json` at *evaluation* time. On a cold runner that
          # leaves `mkDshPlugin-npm-registry` dying with "path … is not valid"
          # before it can even be evaluated. `nix eval` does satisfy IFD, so
          # force the checks to derivations first; this builds the manifest
          # (and its tarball) and nothing else. `--no-build` below then finds
          # the store already warm, which is what makes it able to evaluate
          # that check at all.
          #
          # Only x86_64-linux needs warming: the one IFD check is pinned to it
          # precisely because a foreign system's derivation cannot be built
          # here (see flake-modules/checks.nix).
          nix eval .#checks.x86_64-linux --apply 'builtins.mapAttrs (_: c: c.drvPath)'
          # --all-systems walks every entry in `systems`, not only the
          # runner's. A packaging mistake on aarch64 (a Linux-only attribute,
          # a missing input) surfaces here in minutes instead of in a user's
          # build.
          nix flake check --all-systems --no-build
          nix flake show --legacy --all-systems

  cross-eval:
    runs-on: ubuntu-latest
    needs: eval
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # aarch64-linux is built natively by `checks-aarch64` and is still
      # evaluated here, so an eval regression is reported even when that job is
      # skipped. aarch64-darwin has no runner at all, so it is evaluated but
      # never built: that still catches Linux-only attributes, missing inputs
      # and unsupported dependencies before a user hits them.
      # `x86_64-linux` is the runner itself and is built by the `checks` job.
      - name: Evaluate the non-native systems
        run: |
          set -euo pipefail
          for system in aarch64-linux aarch64-darwin; do
            echo "── $system"
            nix eval ".#packages.$system" --apply builtins.attrNames
            nix eval ".#legacyPackages.$system.dshPackageSets" --apply builtins.attrNames
            nix eval ".#legacyPackages.$system.dshPlugins" --apply builtins.attrNames
            nix eval ".#checks.$system" --apply builtins.attrNames
            nix eval --raw ".#packages.$system.deepseek-harness.drvPath"
            echo
            nix eval --raw ".#packages.$system.dsh-plugin-registry.drvPath"
            echo
          done
          nix eval ".#homeModules" --apply builtins.attrNames
          nix eval ".#nixosModules" --apply builtins.attrNames
          nix eval .#overlays --apply builtins.attrNames
          nix eval .#lib --apply builtins.attrNames

  checks:
    runs-on: ubuntu-latest
    needs: eval
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: End-to-end plugin check (builds deepseek-harness)
        run: nix build -L .#checks.x86_64-linux.plugin-e2e
      - name: Home Manager module check
        run: nix build -L .#checks.x86_64-linux.home-manager-module
      - name: Package version test
        run: nix build -L .#packages.x86_64-linux.deepseek-harness.passthru.tests.version
      # `unstable` tracks upstream's default branch, so its two fixed-output
      # hashes are the ones that go stale. Verify them without paying for the
      # full compile: the source archive and the pnpm dependency store are
      # exactly what breaks when that pin is wrong.
      - name: Unstable pin (source and dependency hashes)
        run: |
          nix build -L \
            .#packages.x86_64-linux.deepseek-harness-unstable.src \
            .#packages.x86_64-linux.deepseek-harness-unstable.pnpmDeps

  # Same build set as `checks`, on a native arm64 runner: evaluating a
  # foreign system proves the expressions type-check, not that the packages
  # compile there. A native build is also the only workable option — a
  # foreign-system eval cannot satisfy import-from-derivation, and emulating
  # the full harness build under QEMU takes hours.
  #
  # `dsh-modules-vm` is deliberately not built here: hosted arm64 runners
  # have no /dev/kvm, so the NixOS test would run under TCG, slowly enough to
  # be a timeout rather than a signal.
  checks-aarch64:
    # Free for public repositories. A private fork without arm64 runners
    # would leave this job queued forever, so it is skipped there instead.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04-arm
    needs: eval
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: End-to-end plugin check (builds deepseek-harness)
        run: nix build -L .#checks.aarch64-linux.plugin-e2e
      - name: Home Manager module check
        run: nix build -L .#checks.aarch64-linux.home-manager-module
      - name: Package version test
        run: nix build -L .#packages.aarch64-linux.deepseek-harness.passthru.tests.version
      # The pnpm store is fetched with `force_ignores_platform`, so this hash
      # is architecture-independent; building it here proves that rather than
      # assuming it.
      - name: Unstable pin (source and dependency hashes)
        run: |
          nix build -L \
            .#packages.aarch64-linux.deepseek-harness-unstable.src \
            .#packages.aarch64-linux.deepseek-harness-unstable.pnpmDeps
